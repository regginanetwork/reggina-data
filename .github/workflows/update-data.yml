name: Aggiorna dati Reggina

on:
  workflow_dispatch:          # pulsante manuale "Run workflow"
  schedule:
    - cron: '*/15 * * * *'    # riserva: ogni 15 min (GitHub non garantisce la puntualità)

# evita che due esecuzioni si sovrappongano
concurrency:
  group: aggiorna-dati
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Esporta i fogli in JSON
        run: python export_data.py

      - name: Salva le modifiche
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rosa-anagrafica.json calendario.json minuti-gol.json
          if git diff --staged --quiet; then
            echo "Nessuna modifica da salvare."
          else
            git commit -m "Aggiornamento dati $(date -u '+%d/%m/%Y %H:%M UTC')"
            git push
          fi
